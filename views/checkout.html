<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/checkout.css">
    <title>Checkout</title>
</head>
<body>
    <header id="header--checkout">
        <div id="contenedor-btns">
            <a id="btn--volver" class="btn--header" href="./detail.html">
                <img src="../storage/svg/previous.svg" alt="Volver">
            </a>
            <h1>Checkout</h1>
            <button id="btn--volver" class="btn--header">
                <img class="btn__menu--img" src="../storage/svg/bars-staggered.svg" alt="">
            </button>
        </div>
    </header>
    <main>
        <section id="lista--productos">
            <div class="card__producto">
                <div class="card__producto--info">
                    <div class="card__img">
                        <img src="../storage/img/dress-2.jpg" alt="">
                    </div>
                    <div class="card__descripcion">
                        <h2>Vestido de fiesta</h2>
                        <p class="card__categoria">Dress</p>
                        <p class="card__precio">Q300.00</p>
                    </div>
                </div>
                <div class="card__cantidad">
                    <div class="card__more">
                        <button>
                            <img src="../storage/svg/more.svg" alt="Ver más">
                        </button>
                    </div>
                    <div class="modificar__cantidad">
                        <button class="btn__menos">
                        </button>
                        <p>1</p>
                        <button class="btn__mas">
                        </button>
                    </div>
                </div>
            </div>
            <hr>
            <div class="card__producto">
                <div class="card__producto--info">
                    <div class="card__img">
                        <img src="../storage/img/dress-1.jpg" alt="">
                    </div>
                    <div class="card__descripcion">
                        <h2>Vestido casual</h2>
                        <p class="card__categoria">Dress</p>
                        <p class="card__precio">Q220.00</p>
                    </div>
                </div>
                <div class="card__cantidad">
                    <div class="card__more">
                        <button>
                            <img src="../storage/svg/more.svg" alt="Ver más">
                        </button>
                    </div>
                    <div class="modificar__cantidad">
                        <button class="btn__menos">
                        </button>
                        <p>1</p>
                        <button class="btn__mas">
                        </button>
                    </div>
                </div>
            </div>
            <hr>
        </section>
        <section id="informacion--envio">
           <h2>Información de envio</h2>
           <div id="informacion--pago">
                <div id="tarjeta">
                    <img src="../storage/svg/visa.svg" alt="Trajeta VISA">
                    <p>**** **** **** 2143</p>
                </div>
                <div id="flecha--abajo">
                    <img src="../storage/svg/chevron-down.svg" alt="Flecha abajo">
                </div>
           </div>
           <div class="informacion--total">
                <p>Total (2 artículos)</p>
                <p>Q520.00</p>
           </div>
           <div class="informacion--total">
                <p>Gastos de envío</p>
                <p>Q0.00</p>
            </div>
            <div class="informacion--total">
                <p>Descuento</p>
                <p>Q0.00</p>
            </div>
            <hr>
            <div class="informacion--total">
                <p>Sub Total</p>
                <p>Q520.00</p>
            </div>
        </section>
    </main>
    <footer id="footer--checkout">
        <p>Pagar</p>
    </footer>
</body>
</html>
